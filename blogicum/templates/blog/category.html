{% extends "base.html" %}

{% block title %} Публикации в категории personal {% endblock %}

{% block content %}
  <h1>Публикации в категории — {{ category_slug }}</h1>
{% for post in post_list %}
  <hr>
    <li>
      <a href="{% url 'blog:post_detail' post.id %}">
        {{ post.title }}
      </a>
    </li>
  </hr>
{% endfor %}
{% endblock %}
