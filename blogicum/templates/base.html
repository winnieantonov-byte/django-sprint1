{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Блогикум{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light shadow-sm" style="background-color: #7fb8e1;">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center text-dark fw-bold" href="{% url 'blog:index' %}">
                    <img src="{% static 'img/logo.png' %}" width="30" height="30" class="me-2" alt="Логотип">
                    Блогикум
                </a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active bg-primary text-white rounded px-3" href="{% url 'blog:index' %}">Лента записей</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-6 text-dark fs-5" href="{% url 'pages:about' %}">О проекте</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-6 text-dark fs-5" href="{% url 'pages:rules' %}">Наши правила</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container py-5">
        {% block content %}
        {% endblock %}
    </main>
    <footer class="container py-3 border-top">
        <p>© 2026 Блогикум</p>
    </footer>
</body>
</html>
