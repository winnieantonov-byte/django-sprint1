{% extends "base.html" %}

{% block title %} Категории | Блогикум {% endblock %}

{% block content %}
  <h1>Публикации в категории — {{ category_slug }}</h1>
<ul>
  {% for post in post_list %}
  <hr>
    <li>
      <a href="{% url 'blog:post_detail' post.id %}">
        {{ post.title }}
      </a>
    </li>
  </hr>
  {% endfor %}
</ul>
{% endblock %}
