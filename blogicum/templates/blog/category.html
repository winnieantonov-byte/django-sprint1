{% extends "base.html" %}

{% block content %}
  <h1>Публикации в категории — {{ category_slug.title }}</h1>
  <hr>
  
  <ul>
    {% for post in post_list %}
      <li>
        <a href="{% url 'blog:post_detail' post.id %}">
          {{ post.title }}
        </a>
      </li>
    {% empty %}
      <li>В этой категории пока нет публикаций.</li>
    {% endfor %}
  </ul>
{% endblock %}
